name: Integration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: recsys/go.mod
          cache-dependency-path: recsys/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-softline/package-lock.json
      - run: make check
        working-directory: recsys
      - run: make test-e2e
        working-directory: recsys
      - run: npm ci && npm run build
        working-directory: frontend-softline
