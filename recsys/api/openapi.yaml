openapi: 3.0.3
info:
  title: Softline Recommendations API
  version: 0.1.0
  description: HTTP API for personal-account (ЛК) sessions, catalog products, isolated online purchases, and recommendations.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Database and schema are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
                  schema_version: {type: string}
                  catalog_version: {type: string}
                  feed_generated_at: {type: string, format: date-time}
                  catalog_imported_at: {type: string, format: date-time}
        '503':
          description: Database or schema is unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [not_ready]}
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password, client_group]
              properties:
                login: {type: string}
                password: {type: string, format: password}
                client_group: {$ref: '#/components/schemas/ClientGroup'}
                industry: {type: string}
      responses:
        '201':
          description: Demo account created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [profile_id, client_group, access_token, expires_at]
                properties:
                  profile_id: {type: string}
                  client_group: {$ref: '#/components/schemas/ClientGroup'}
                  access_token: {type: string}
                  expires_at: {type: string, format: date-time}
        '400':
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Login already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Demo session created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_at]
                properties:
                  access_token: {type: string}
                  expires_at: {type: string, format: date-time}
                  profile_id: {type: string}
        '400':
          description: Invalid login payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [profile_id, client_group, role]
                properties:
                  profile_id: {type: string}
                  role: {type: string, enum: [unverified, verified, admin]}
                  client_id: {type: string}
                  client_group: {$ref: '#/components/schemas/ClientGroup'}
                  industry: {type: string}
                  login: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products:
    get:
      operationId: listProducts
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0}
        - in: query
          name: q
          schema: {type: string}
        - in: query
          name: with_history
          schema: {type: boolean}
      responses:
        '200':
          description: Page of catalog products
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  catalog_version: {type: string}
                  feed_generated_at: {type: string, format: date-time}
                  catalog_imported_at: {type: string, format: date-time}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
                  total: {type: integer, minimum: 0}
                  limit: {type: integer, minimum: 1}
                  offset: {type: integer, minimum: 0}
        '400':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products/{itemID}:
    get:
      operationId: getProductDetail
      parameters:
        - in: path
          name: itemID
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Full catalog card for the item
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{itemID}/score-history:
    get:
      operationId: getScoreHistory
      parameters:
        - in: path
          name: itemID
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Average recommendation score timeline across all users
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrator access required
  /stats:
    get:
      operationId: getStats
      responses:
        '200':
          description: Row counts of the demo database tables
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /runs:
    get:
      operationId: listRuns
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      responses:
        '200':
          description: Recent stand runs for the administrator profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrator access required
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRun'
      responses:
        '201':
          description: Created stand run
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrator access required
  /events:
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackEvent'
      responses:
        '201':
          description: Feedback event recorded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {type: boolean}
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrator access required
        '404':
          description: Run or offer not found for this profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases:
    get:
      operationId: listPurchases
      responses:
        '200':
          description: Up to 100 most recent purchases of the authenticated profile
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [order_id, title, purchased_at]
                      properties:
                        order_id: {type: string}
                        title: {type: string}
                        purchased_at: {type: string, format: date-time}
                        total: {type: number}
                        currency: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item_id]
              properties:
                item_id: {type: string}
      responses:
        '201':
          description: Demo purchase recorded for the current profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [order_id, item_id]
                properties:
                  order_id: {type: string}
                  item_id: {type: string}
                  offer_id: {type: string}
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recommendations/guest:
    get:
      operationId: getGuestRecommendations
      security: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 36}
      responses:
        '200':
          description: Cold start recommendations for an anonymous visitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendations'
  /admin/recommendations:
    get:
      operationId: getPreviewRecommendationDiagnostics
      parameters:
        - in: query
          name: target
          schema: {type: string, enum: [guest, notver, verb2b, verb2c, admin], default: guest}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 36}
        - name: mode
          in: query
          description: Clean preset or the latest active authenticated test session
          schema: {type: string, enum: [clean, latest], default: clean}
      responses:
        '200':
          description: Preview recommendations, table counts, and recorded runs
          content:
            application/json:
              schema:
                type: object
                required: [target, duration_ms, recommendations, tables, runs]
                properties:
                  target: {type: string}
                  duration_ms: {type: integer, format: int64}
                  recommendations: {$ref: '#/components/schemas/Recommendations'}
                  tables:
                    type: object
                    nullable: true
                    additionalProperties: {type: integer, format: int64}
                  runs:
                    type: array
                    items: {$ref: '#/components/schemas/Run'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrator role is required
  /recommendations/me:
    get:
      operationId: getCurrentRecommendations
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 36}
      responses:
        '200':
          description: Recommendations for the session profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendations'
        '400':
          description: Profile override is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Recommendation service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Recommendation service timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  headers:
    XRequestID:
      description: Request correlation identifier returned on both success and error responses
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid session
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ClientGroup:
      type: string
      enum: [B2B, B2C]
    Error:
      type: object
      required: [request_id, error]
      properties:
        request_id: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Stats:
      type: object
      required: [status, model_version, tables]
      properties:
        status: {type: string}
        model_version: {type: string}
        tables:
          type: object
          additionalProperties: {type: integer, minimum: 0}
    NewRun:
      type: object
      required: [items]
      properties:
        model_version: {type: string}
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required: [item_id]
            properties:
              item_id: {type: string}
              offer_id: {type: string}
              explanation: {type: string}
              score: {type: number}
    RunItem:
      type: object
      required: [item_id, offer_id, explanation, score]
      properties:
        item_id: {type: string}
        offer_id: {type: string}
        explanation: {type: string}
        score: {type: number}
    Run:
      type: object
      required: [run_id, model_version, requested_at, items, clicks, purchases]
      properties:
        run_id: {type: integer}
        client_id: {type: string}
        model_version: {type: string}
        requested_at: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/RunItem'}
        clicks: {type: integer, minimum: 0}
        purchases: {type: integer, minimum: 0}
    RunList:
      type: object
      required: [user_id, client_id, runs]
      properties:
        user_id: {type: string}
        client_id: {type: string}
        runs:
          type: array
          items: {$ref: '#/components/schemas/Run'}
    FeedbackEvent:
      type: object
      required: [run_id, offer_id, event_type]
      properties:
        run_id: {type: integer}
        offer_id: {type: string}
        event_type: {type: string, enum: [click, purchase]}
    ScorePoint:
      type: object
      required: [at, score, runs]
      properties:
        at: {type: string, format: date-time}
        score: {type: number}
        runs: {type: integer, minimum: 0}
    ScoreHistory:
      type: object
      required: [item_id, average, points]
      properties:
        item_id: {type: string}
        average: {type: number}
        points:
          type: array
          items: {$ref: '#/components/schemas/ScorePoint'}
    ProductDetail:
      type: object
      required: [item_id, offer_id, sku, title, category, vendor, available, parameters]
      properties:
        item_id: {type: string}
        offer_id: {type: string}
        sku: {type: string}
        title: {type: string}
        category: {type: string}
        vendor: {type: string}
        price: {type: number}
        old_price: {type: number}
        currency_code: {type: string}
        available: {type: boolean}
        url: {type: string, format: uri}
        description: {type: string}
        picture_url: {type: string, format: uri}
        vendor_url: {type: string, format: uri}
        delivery: {type: boolean}
        pickup: {type: boolean}
        sales_notes: {type: string}
        parameters:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string}
              value: {type: string}
    Product:
      type: object
      required: [item_id, sku, title, category, vendor, available]
      properties:
        item_id: {type: string}
        offer_id: {type: string}
        sku: {type: string, nullable: true}
        title: {type: string}
        category: {type: string}
        vendor: {type: string}
        price: {type: number}
        currency_code: {type: string}
        available: {type: boolean}
        has_history: {type: boolean}
        url: {type: string, format: uri}
    Recommendations:
      type: object
      required: [request_id, snapshot_id, partial_reason, items, graph]
      properties:
        request_id: {type: string}
        snapshot_id: {type: string}
        partial_reason: {type: string, nullable: true}
        items:
          type: array
          maxItems: 36
          description: Метрика Precision@3 считает первые три позиции, остальные позиции предназначены только для экрана.
          items: {$ref: '#/components/schemas/Recommendation'}
        graph:
          $ref: '#/components/schemas/Graph'
    Recommendation:
      type: object
      required: [item_id, sku, recommendation_kind, family_id, title, explanation, variants, evidence_ids]
      properties:
        item_id: {type: string}
        offer_id: {type: string}
        sku: {type: string, nullable: true}
        status: {type: string, enum: [confirmed, review], description: Статус проверки связи, если он указан в источнике.}
        recommendation_kind:
          type: string
          enum: [renewal, upgrade, complement, behavioral, popular]
        family_id: {type: string, nullable: true}
        title: {type: string}
        url: {type: string, format: uri}
        price: {type: number}
        currency_code: {type: string}
        category: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        explanation: {type: string}
        variants:
          type: array
          items: {$ref: '#/components/schemas/Variant'}
        evidence_ids:
          type: array
          items: {type: string}
    Variant:
      type: object
      required: [item_id, differences]
      properties:
        item_id: {type: string}
        url: {type: string, format: uri}
        differences:
          type: array
          items:
            type: object
            required: [field, value, unit, source]
            properties:
              field: {type: string}
              value: {}
              unit: {type: string}
              source: {type: string}
    Graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, type, label]
            properties:
              id: {type: string}
              type: {type: string}
              label: {type: string}
        edges:
          type: array
          items:
            type: object
            required: [id, from, to, type, weight, reason, source, snapshot_id]
            properties:
              id: {type: string}
              from: {type: string}
              to: {type: string}
              type: {type: string}
              weight: {type: number}
              reason: {type: string}
              source: {type: string}
              snapshot_id: {type: string}
