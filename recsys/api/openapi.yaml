openapi: 3.0.3
info:
  title: Softline Recommendations API
  version: 0.1.0
  description: HTTP API for personal-account (ЛК) sessions, catalog products, isolated online purchases, and recommendations.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Database and schema are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
                  schema_version: {type: string}
        '503':
          description: Database or schema is unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [not_ready]}
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password, client_group]
              properties:
                login: {type: string}
                password: {type: string, format: password}
                client_group: {$ref: '#/components/schemas/ClientGroup'}
                industry: {type: string}
      responses:
        '201':
          description: Demo account created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [profile_id, client_group, access_token, expires_at]
                properties:
                  profile_id: {type: string}
                  client_group: {$ref: '#/components/schemas/ClientGroup'}
                  access_token: {type: string}
                  expires_at: {type: string, format: date-time}
        '400':
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Login already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Demo session created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_at]
                properties:
                  access_token: {type: string}
                  expires_at: {type: string, format: date-time}
                  profile_id: {type: string}
        '400':
          description: Invalid login payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [profile_id, client_group]
                properties:
                  profile_id: {type: string}
                  client_id: {type: string}
                  client_group: {$ref: '#/components/schemas/ClientGroup'}
                  industry: {type: string}
                  login: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products:
    get:
      operationId: listProducts
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Page of catalog products
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
        '400':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /purchases:
    post:
      operationId: createPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item_id]
              properties:
                item_id: {type: string}
      responses:
        '201':
          description: Demo purchase recorded for the current profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [order_id, item_id]
                properties:
                  order_id: {type: string}
                  item_id: {type: string}
                  offer_id: {type: string}
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recommendations/me:
    get:
      operationId: getCurrentRecommendations
      responses:
        '200':
          description: Recommendations for the session profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendations'
        '400':
          description: Profile override is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  headers:
    XRequestID:
      description: Request correlation identifier returned on both success and error responses
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid session
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ClientGroup:
      type: string
      enum: [B2B, B2C]
    Error:
      type: object
      required: [request_id, error]
      properties:
        request_id: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Product:
      type: object
      required: [item_id, sku, title, category, vendor, available]
      properties:
        item_id: {type: string}
        offer_id: {type: string}
        sku: {type: string, nullable: true}
        title: {type: string}
        category: {type: string}
        vendor: {type: string}
        price: {type: number}
        currency_code: {type: string}
        available: {type: boolean}
        url: {type: string, format: uri}
    Recommendations:
      type: object
      required: [request_id, snapshot_id, partial_reason, items, graph]
      properties:
        request_id: {type: string}
        snapshot_id: {type: string}
        partial_reason: {type: string, nullable: true}
        items:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/Recommendation'}
        graph:
          $ref: '#/components/schemas/Graph'
    Recommendation:
      type: object
      required: [item_id, sku, recommendation_kind, family_id, title, explanation, variants, evidence_ids]
      properties:
        item_id: {type: string}
        offer_id: {type: string}
        sku: {type: string, nullable: true}
        recommendation_kind:
          type: string
          enum: [renewal, upgrade, complement, behavioral, popular]
        family_id: {type: string, nullable: true}
        title: {type: string}
        url: {type: string, format: uri}
        price: {type: number}
        currency_code: {type: string}
        explanation: {type: string}
        variants:
          type: array
          items: {$ref: '#/components/schemas/Variant'}
        evidence_ids:
          type: array
          items: {type: string}
    Variant:
      type: object
      required: [item_id, differences]
      properties:
        item_id: {type: string}
        url: {type: string, format: uri}
        differences:
          type: array
          items:
            type: object
            required: [field, value, unit, source]
            properties:
              field: {type: string}
              value: {}
              unit: {type: string}
              source: {type: string}
    Graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, type, label]
            properties:
              id: {type: string}
              type: {type: string}
              label: {type: string}
        edges:
          type: array
          items:
            type: object
            required: [id, from, to, type, weight, reason, source, snapshot_id]
            properties:
              id: {type: string}
              from: {type: string}
              to: {type: string}
              type: {type: string}
              weight: {type: number}
              reason: {type: string}
              source: {type: string}
              snapshot_id: {type: string}
