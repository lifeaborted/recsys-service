services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recsys_dev
      POSTGRES_PASSWORD: recsys_dev
      POSTGRES_DB: recsys_dev
    ports:
      - "127.0.0.1:${RECSYS_DEV_PG_PORT:-55432}:5432"
    volumes:
      - dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "recsys_dev", "-d", "recsys_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev-data:
